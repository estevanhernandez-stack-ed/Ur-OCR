name: test

# Runs the standalone unit tests on every PR and every push to main.
# The unit-test project references only the main project (no ROROROblox
# sibling), so it builds and runs clean in CI. The IntegrationTests project
# is intentionally NOT run here — it needs host plumbing not present in CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/RoRoRo.UrOcr.Tests/RoRoRo.UrOcr.Tests.csproj

      - name: Test (unit)
        run: dotnet test tests/RoRoRo.UrOcr.Tests/RoRoRo.UrOcr.Tests.csproj -c Release --no-restore --nologo
